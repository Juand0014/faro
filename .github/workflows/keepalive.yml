# Mantiene el proyecto Supabase despierto (se pausa tras 7 días sin actividad).
# Hace un ping ligero cada 4 días.
name: Supabase keep-alive
on:
  schedule:
    - cron: '0 12 */4 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/couples?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
